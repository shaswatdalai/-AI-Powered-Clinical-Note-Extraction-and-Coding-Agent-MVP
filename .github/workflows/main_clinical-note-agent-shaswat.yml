
# Build and deploy Python app to Azure Web App

name: Build and deploy Python app to Azure Web App - clinical-note-agent-shaswat

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Validate Python syntax without installing heavy ML dependencies.
      - name: Validate Python files
        run: |
          python -m compileall -q src

      # Upload source files only; Azure Oryx installs requirements.
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !.git/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_29C3C5AF4999413593E18916B5C6D179 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D673635729F64A8FB1A1486A6D9F4D1D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_62D78A45E08740DAA67FD124E7359B82 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: clinical-note-agent-shaswat
          slot-name: Production
